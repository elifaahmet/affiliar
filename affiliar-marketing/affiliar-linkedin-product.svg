<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="violetGrad" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&amp;display=swap');
      .a-mark, .word-affiliar { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 400; }
    </style>
  </defs>

  <rect width="400" height="400" fill="url(#violetGrad)"/>

  <text x="200" y="240" text-anchor="middle" class="a-mark" font-size="260" fill="#FFFFFF">a</text>

  <text x="200" y="330" text-anchor="middle" class="word-affiliar" font-size="62" letter-spacing="-1" fill="#FFFFFF">affiliar</text>
</svg>
