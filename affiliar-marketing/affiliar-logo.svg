<svg width="640" height="200" viewBox="0 0 640 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="violetGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&amp;display=swap');
      .word-affiliar, .a-mark { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 400; }
    </style>
  </defs>

  <g transform="translate(0 0)">
    <rect width="200" height="200" rx="40" ry="40" fill="url(#violetGrad)"/>
    <text x="100" y="148" text-anchor="middle" class="a-mark" font-size="160" fill="#FFFFFF">a</text>
  </g>

  <text x="232" y="140" class="word-affiliar" font-size="140" letter-spacing="-2" fill="#111827">affiliar</text>
</svg>
