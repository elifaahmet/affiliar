<svg width="150" height="32" viewBox="0 0 150 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="affiliarDarkMark" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" />
      <stop offset="1" stop-color="#6D28D9" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#affiliarDarkMark)" />
  <!-- Mark "a" — baseline y=21.75 (chip center 16 + half x-height ≈
       5.75) so the 23px italic glyph sits visually centered. -->
  <text
    x="16"
    y="21.75"
    fill="#FFFFFF"
    font-family="'Instrument Serif', 'Iowan Old Style', 'Apple Garamond', Baskerville, 'Times New Roman', serif"
    font-size="23"
    font-style="italic"
    font-weight="400"
    text-anchor="middle"
  >a</text>
  <!-- Wordmark sharing the mark's baseline. -->
  <text
    x="42"
    y="21.75"
    fill="#0A0A0A"
    font-family="'Instrument Serif', 'Iowan Old Style', 'Apple Garamond', Baskerville, 'Times New Roman', serif"
    font-size="23"
    font-style="italic"
    font-weight="400"
    letter-spacing="-0.2"
  >affiliar</text>
</svg>
