<svg width="160" height="36" viewBox="0 0 160 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="affiliarLightMark" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" />
      <stop offset="1" stop-color="#6D28D9" />
    </linearGradient>
  </defs>
  <!-- Mark: violet rounded chip -->
  <rect width="36" height="36" rx="9" fill="url(#affiliarLightMark)" />
  <!-- Italic serif "a" mark — Instrument Serif when loaded, system serif fallback -->
  <text
    x="18"
    y="18"
    fill="#FFFFFF"
    font-family="'Instrument Serif', 'Iowan Old Style', 'Apple Garamond', Baskerville, 'Times New Roman', serif"
    font-size="26"
    font-style="italic"
    font-weight="400"
    text-anchor="middle"
    dominant-baseline="central"
  >a</text>
  <!-- Wordmark: Inter 600 in white for dark backgrounds -->
  <text
    x="48"
    y="18.5"
    fill="#FFFFFF"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="18"
    font-weight="600"
    letter-spacing="-0.4"
    dominant-baseline="central"
  >affiliar</text>
</svg>
