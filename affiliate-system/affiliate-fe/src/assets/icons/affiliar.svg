<svg width="170" height="36" viewBox="0 0 170 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="affiliarLightMark" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" />
      <stop offset="1" stop-color="#6D28D9" />
    </linearGradient>
  </defs>
  <rect width="36" height="36" rx="9" fill="url(#affiliarLightMark)" />
  <!-- Mark "a" — explicit alphabetic baseline at y=26 (centers a 26px
       italic glyph in a 36px chip across browsers). -->
  <text
    x="18"
    y="26"
    fill="#FFFFFF"
    font-family="'Instrument Serif', 'Iowan Old Style', 'Apple Garamond', Baskerville, 'Times New Roman', serif"
    font-size="26"
    font-style="italic"
    font-weight="400"
    text-anchor="middle"
  >a</text>
  <!-- Wordmark on the same baseline as the mark so the chip and the
       lockup type ride the same line. -->
  <text
    x="48"
    y="26"
    fill="#FFFFFF"
    font-family="'Instrument Serif', 'Iowan Old Style', 'Apple Garamond', Baskerville, 'Times New Roman', serif"
    font-size="26"
    font-style="italic"
    font-weight="400"
    letter-spacing="-0.2"
  >affiliar</text>
</svg>
