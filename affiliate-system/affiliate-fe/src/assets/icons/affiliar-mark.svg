<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="affiliarMark" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" />
      <stop offset="1" stop-color="#6D28D9" />
    </linearGradient>
  </defs>
  <rect width="36" height="36" rx="9" fill="url(#affiliarMark)" />
  <!-- Italic serif "a" — baseline y=24.5 (chip center 18 + half x-height
       ≈ 6.5) so the lowercase glyph sits visually centered. -->
  <text
    x="18"
    y="24.5"
    fill="#FFFFFF"
    font-family="'Instrument Serif', 'Iowan Old Style', 'Apple Garamond', Baskerville, 'Times New Roman', serif"
    font-size="26"
    font-style="italic"
    font-weight="400"
    text-anchor="middle"
  >a</text>
</svg>
