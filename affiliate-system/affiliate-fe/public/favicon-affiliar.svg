<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" />
      <stop offset="1" stop-color="#6D28D9" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#g)" />
  <!-- Italic serif "a" — explicit alphabetic baseline (y=23) so browsers
       render it identically. Without dominant-baseline the math is
       predictable: a 24px glyph in a 32px box optically sits centered
       when its baseline is ~y=23. -->
  <text
    x="16"
    y="23"
    font-family="'Instrument Serif', 'Iowan Old Style', 'Apple Garamond', Baskerville, 'Times New Roman', serif"
    font-size="24"
    font-style="italic"
    font-weight="400"
    fill="white"
    text-anchor="middle"
  >a</text>
</svg>
